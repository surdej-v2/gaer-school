  <text x="386" y="414" font-size="13" fill="#64748b">Elever</text><text x="386" y="458" font-size="34" font-weight="700" fill="#020817">0</text>
  <rect x="648" y="384" width="268" height="96" rx="16" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="670" y="414" font-size="13" fill="#64748b">Repos klar</text><text x="670" y="458" font-size="34" font-weight="700" fill="#020817">0</text>
  <rect x="932" y="384" width="268" height="96" rx="16" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="954" y="414" font-size="13" fill="#64748b">Afventer eller fejl</text><text x="954" y="458" font-size="34" font-weight="700" fill="#020817">0</text>

  <!-- empty table -->
  <text x="80" y="526" font-size="17" font-weight="700" fill="#020817">Mine klasser</text>
  <rect x="80" y="540" width="816" height="96" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
  <path d="M81 580 H895" stroke="#e2e8f0"/>
  <g font-size="12" font-weight="600" fill="#64748b"><text x="100" y="565">Klasse</text><text x="330" y="565">Skabelon</text><text x="540" y="565">Elever</text><text x="610" y="565">Repos klar</text><text x="770" y="565">Status</text></g>
  <text x="100" y="613" font-size="14" fill="#64748b">Ingen klasser endnu.</text>

  <rect x="920" y="508" width="280" height="128" rx="16" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="942" y="542" font-size="17" font-weight="700" fill="#020817">Kræver handling</text>
  <text x="942" y="570" font-size="13" fill="#64748b">Intet lige nu.</text>
