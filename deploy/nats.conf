# NATS for Gær — used by docker-compose.yml (local) and deploy/compose.yml (production).
# Clients on 4222, monitoring (HTTP, read only, no auth) on 8222 — /admin/nats reads it through the app.
# Neither port is published in production: only containers in the stack can reach them.
# The token (NATS_TOKEN) is passed on the command line by compose when it is set; see the nats service.

server_name: gaer-nats
port: 4222
http_port: 8222

# JetStream: streams, key/value and object stores on the persistent volume mounted at /data.
jetstream {
  store_dir: "/data"
  max_memory_store: 256MB
  max_file_store: 10GB
}

max_payload: 1MB
write_deadline: "10s"
lame_duck_duration: "30s"
