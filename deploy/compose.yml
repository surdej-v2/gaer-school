# Production stack on the UpCloud server, in ~/gaer next to .env (stack secrets) and app.env (app settings).
# Postgres, the app, NATS (JetStream on its own volume) and cloudflared. Driven by deploy.sh; IMAGE is passed in by it. Traffic arrives through the Cloudflare Tunnel — no open ports.

name: gaer

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      DB_NAME: ${DB_NAME:?}
      DB_OWNER_PASSWORD: ${DB_OWNER_PASSWORD:?}
      DB_APP_PASSWORD: ${DB_APP_PASSWORD:?}
      DB_PURGE_PASSWORD: ${DB_PURGE_PASSWORD:?}
      DB_MCP_RO_PASSWORD: ${DB_MCP_RO_PASSWORD:-}
    volumes:
      - postgres:/var/lib/postgresql/data
      - ./postgres-init.sh:/docker-entrypoint-initdb.d/10-gaer.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      retries: 20

  app:
    image: ${IMAGE:?}
    restart: unless-stopped
    env_file: app.env
    environment:
      GAER_ENV: production
      TRUST_PROXY: "1"
      GAER_VERSION: ${GAER_VERSION:-unknown}
      DATABASE_URL: postgresql://${DB_NAME}_app:${DB_APP_PASSWORD}@postgres:5432/${DB_NAME}
      PURGE_DATABASE_URL: postgresql://${DB_NAME}_purge:${DB_PURGE_PASSWORD}@postgres:5432/${DB_NAME}
      MIGRATION_DATABASE_URL: postgresql://${DB_NAME}_owner:${DB_OWNER_PASSWORD}@postgres:5432/${DB_NAME}
      # db_query in /mcp/admin (read only); empty when DB_MCP_RO_PASSWORD is not set
      MCP_DB_QUERY_URL: ${DB_MCP_RO_PASSWORD:+postgresql://${DB_NAME}_mcp_ro:${DB_MCP_RO_PASSWORD}@postgres:5432/${DB_NAME}}
      # NATS in the stack: clients with the token, monitoring for /admin/nats (internal network only)
      NATS_URL: nats://${NATS_TOKEN:+${NATS_TOKEN}@}nats:4222
      NATS_MONITOR_URL: http://nats:8222
    depends_on:
      postgres: { condition: service_healthy }

  # NATS with JetStream. Data (streams, key/value, object stores) lives on the "nats" volume, so it survives
  # restarts and new versions. No published ports; the token comes from NATS_TOKEN in .env (no auth if empty).
  nats:
    image: nats:2.15.2-alpine
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-c", "exec nats-server -c /etc/nats/gaer.conf $${NATS_TOKEN:+--auth \"$$NATS_TOKEN\"}"]
    environment:
      NATS_TOKEN: ${NATS_TOKEN:-}
    volumes:
      - nats:/data
      - ./nats.conf:/etc/nats/gaer.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider 'http://localhost:8222/healthz?js-enabled-only=true'"]
      interval: 5s
      retries: 20

  cloudflared:
    image: cloudflare/cloudflared:2026.10.7
    restart: unless-stopped
    command: tunnel --no-autoupdate run --url http://app:8000
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:?}

volumes:
  postgres:
  nats:
